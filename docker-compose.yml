services:
  db:
    image: postgres:16-alpine
    container_name: studbook-db
    environment:
      POSTGRES_USER: studbook
      POSTGRES_PASSWORD: studbook
      POSTGRES_DB: studbook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./StudBook.Backend
      dockerfile: Dockerfile
    container_name: studbook-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=studbook;Username=studbook;Password=studbook"
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Статические HTML-страницы (позже здесь будет сборка Flutter Web)
  frontend:
    image: nginx:alpine
    container_name: studbook-frontend
    volumes:
      - ./StudBook.Frontend/html:/usr/share/nginx/html:ro
      - ./StudBook.Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata: