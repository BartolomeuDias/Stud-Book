server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /login -> login.html, /client -> client.html и т.д.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # API и служебные эндпоинты проксируются на бэкенд (сервис "api" из docker-compose)
    location /api/     { proxy_pass http://api:8080; }
    location /health   { proxy_pass http://api:8080; }
    location /openapi/ { proxy_pass http://api:8080; }
}