<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Добавить лошадь — Stud Book</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
    <body class="wide">
        <div class="card">
            <header class="page-header">
                <div>
                    <h1>Добавить лошадь</h1>
                    <p class="subtitle">Реестр · Ranch Staff</p>
                </div>
                <nav class="top-nav">
                    <a href="/staff">← К реестру</a>
                </nav>
            </header>

            <form id="form" class="horse-form">
                <div class="form-grid">
                    <label>
                        Кличка *
                        <input name="name" required maxlength="200" autocomplete="off">
                    </label>
                    <label>
                        Категория *
                        <select name="category" id="category" required>
                            <option value="OwnStallion">Свой жеребец</option>
                            <option value="ManagedStallion">Жеребец на управлении</option>
                            <option value="ClientHorse" selected>Лошадь клиента</option>
                        </select>
                    </label>
                    <label>
                        Пол *
                        <select name="sex" required>
                            <option value="Stallion">Жеребец</option>
                            <option value="Mare" selected>Кобыла</option>
                            <option value="Gelding">Мерин</option>
                        </select>
                    </label>
                    <label>
                        Порода *
                        <input name="breed" required maxlength="100" placeholder="Quarter Horse">
                    </label>
                    <label>
                        Масть *
                        <input name="color" required maxlength="50" placeholder="Bay">
                    </label>
                    <label>
                        Дата рождения
                        <input name="dateOfBirth" type="date">
                    </label>
                    <label>
                        Рег. номер
                        <input name="registrationNumber" maxlength="50">
                    </label>
                    <label id="owner-field">
                        Владелец (клиент)
                        <select name="ownerClientId" id="ownerClientId">
                            <option value="">— не указан —</option>
                        </select>
                    </label>
                    <label>
                        Отец (жеребец)
                        <select name="sireId" id="sireId">
                            <option value="">— не указан —</option>
                        </select>
                    </label>
                    <label>
                        Мать (кобыла)
                        <select name="damId" id="damId">
                            <option value="">— не указан —</option>
                        </select>
                    </label>
                </div>
                <label class="full">
                    Заметки
                    <textarea name="notes" rows="3" maxlength="2000"></textarea>
                </label>

                <p id="form-error" class="form-error" hidden></p>
                <div class="form-actions">
                    <button type="submit">Сохранить</button>
                    <a class="link-muted" href="/staff">Отмена</a>
                </div>
            </form>
        </div>

        <script src="/js/horse-add.js"></script>
    </body>
</html>
