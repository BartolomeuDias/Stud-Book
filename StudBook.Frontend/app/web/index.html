<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stud Book — horse registry and breeding management for Circle-J Ranch.">
  <meta name="theme-color" content="#1F4A38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stud Book">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Stud Book</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --paper: #F4F0E7;
      --green: #1F4A38;
      --rule: #D6CFBF;
    }
    html, body { margin: 0; height: 100%; background: var(--paper); }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      transition: opacity 400ms cubic-bezier(0.33, 1, 0.68, 1), visibility 0s linear 400ms;
    }
    #splash.hidden { opacity: 0; visibility: hidden; }
    #splash { flex-direction: column; gap: 24px; }
    #splash svg {
      width: 64px;
      height: 64px;
      fill: none;
      stroke: var(--green);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #splash .bar {
      position: relative;
      width: 160px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--rule);
    }
    #splash .bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: inherit;
      background: var(--green);
      animation: slide 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 3v8a6 6 0 0 0 12 0V3"/>
      <path d="M4.5 3h3"/>
      <path d="M16.5 3h3"/>
    </svg>
    <span class="bar"></span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
